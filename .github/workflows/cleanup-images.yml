name: Cleanup Container Images

on:
  workflow_run:
    workflows:
      - Publish Container
    types:
      - completed
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 0"

permissions:
  contents: read
  packages: write

jobs:
  cleanup:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Delete old GHCR versions
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const packageName = 'lupa';
            const packageType = 'container';
            const ownerType = context.payload.repository?.owner?.type ?? 'User';

            const basePath =
              ownerType === 'Organization'
                ? `/orgs/${owner}/packages/${packageType}/${packageName}/versions`
                : `/users/${owner}/packages/${packageType}/${packageName}/versions`;

            let versions;
            try {
              versions = await github.paginate(`GET ${basePath}`, {
                per_page: 100,
              });
            } catch (error) {
              if (error.status === 404) {
                core.info(`No package versions found yet for ghcr.io/${owner}/${packageName}.`);
                return;
              }

              throw error;
            }

            const taggedVersions = versions
              .filter((version) => (version.metadata?.container?.tags ?? []).length > 0)
              .sort(
                (left, right) => new Date(right.created_at).getTime() - new Date(left.created_at).getTime()
              );

            const keep = 3;
            const toDelete = taggedVersions.slice(keep);

            core.info(`Found ${versions.length} package version(s) total for ghcr.io/${owner}/${packageName}.`);
            core.info(`Found ${taggedVersions.length} tagged image version(s).`);
            core.info(`Keeping ${Math.min(keep, taggedVersions.length)} most recent tagged version(s).`);

            for (const version of toDelete) {
              const tags = (version.metadata?.container?.tags ?? []).join(', ') || '(untagged)';
              core.info(`Deleting package version ${version.id} [${tags}] created ${version.created_at}`);
              await github.request(`DELETE ${basePath}/{package_version_id}`, {
                package_version_id: version.id,
              });
            }
